<!DOCTYPE html>
<html lang="ne">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
  <title>श्री गणेश संगीत यन्त्र</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Tiro+Devanagari+Hindi:ital@0;1&display=swap');
    :root { --bg:#120d08; --gold:#e8a830; --gold2:#c47a10; --panel:#1a1008; --border:#4a3010; }
    * { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
    html,body { height:100%; overflow:hidden; background:var(--bg); font-family:'Tiro Devanagari Hindi',serif; color:#e0c898; }

    #app { display:flex; flex-direction:column; height:100dvh; max-width:520px; margin:0 auto; overflow:hidden; background:linear-gradient(180deg,#18100a,#100b06); border-left:1px solid #2a1c0c; border-right:1px solid #2a1c0c; }

    /* HEADER */
    .hdr { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; padding:6px 10px 4px; border-bottom:1px solid #3a2410; background:linear-gradient(180deg,#261808,#1a1008); }
    .hdr-title { font-size:15px; font-weight:bold; color:var(--gold); text-shadow:0 0 12px rgba(232,168,48,0.45); letter-spacing:1.2px; }
    .hdr-right { display:flex; align-items:center; gap:5px; }
    .sbadge { font-family:'Share Tech Mono',monospace; font-size:9px; color:#50c070; background:#091a0f; border:1px solid #1e5030; border-radius:4px; padding:1px 6px; transition:all .3s; }
    .sbadge.busy { color:#f0b030; background:#1c1404; border-color:#5a4010; }
    .sbadge.err { color:#f06060; background:#1c0808; border-color:#5a1818; }
    .ibtn { width:26px; height:26px; border-radius:50%; background:radial-gradient(circle at 38% 32%,#523218,#241408); border:1px solid #7a5020; color:var(--gold); font-size:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; flex-shrink:0; }
    .ibtn:active { transform:scale(0.92); }
    .ibtn.on { background:radial-gradient(circle at 38% 32%,#7a4010,#3a1c06); box-shadow:0 0 8px rgba(232,168,48,0.6); }

    /* TABS */
    .tabs { flex-shrink:0; display:flex; gap:3px; padding:4px 8px; background:#140e07; border-bottom:1px solid #2e1e0c; }
    .tab { flex:1; padding:4px 2px; border:1px solid #3a2410; border-radius:5px; background:#1c1309; color:#7a6040; font-size:11px; font-family:'Tiro Devanagari Hindi',serif; cursor:pointer; text-align:center; transition:all .15s; white-space:nowrap; }
    .tab.on { background:linear-gradient(180deg,#4a2e10,#2e1a08); border-color:var(--gold); color:#f5c842; font-weight:bold; box-shadow:0 0 8px rgba(232,168,48,0.2); }

    /* SELECTOR BAR */
    #selbar { flex-shrink:0; display:flex; gap:4px; padding:4px 8px; background:#130c05; border-bottom:1px solid #261808; align-items:center; flex-wrap:wrap; }
    .msel { flex:1; min-width:95px; padding:3px 6px; background:#1c1308; border:1px solid #4a3014; border-radius:5px; color:#d8b878; font-size:11px; font-family:'Tiro Devanagari Hindi',serif; outline:none; cursor:pointer; }
    .msel:focus { border-color:var(--gold); }
    .sbtn { padding:3px 8px; background:linear-gradient(180deg,#3d2610,#241508); border:1px solid #6a4420; border-radius:5px; color:var(--gold); font-size:11px; font-family:'Tiro Devanagari Hindi',serif; cursor:pointer; white-space:nowrap; }
    .sbtn:active { transform:scale(0.95); }

    /* CASSETTE / CD STAGE */
    #stage { flex-shrink:0; padding:6px 10px 4px; display:flex; flex-direction:column; align-items:center; background:radial-gradient(ellipse at 50% 45%,#221508,#110b05); border-bottom:1px solid #2a1b0a; position:relative; }
    .skin-row { position:absolute; top:6px; right:10px; display:flex; gap:4px; z-index:5; }
    .skbtn { padding:2px 6px; font-size:9px; font-family:'Share Tech Mono',monospace; background:#1e1308; border:1px solid #4a3014; border-radius:4px; color:#a88858; cursor:pointer; }
    .skbtn.on { border-color:var(--gold); color:var(--gold); background:#33200c; }

    /* SKINS */
    .cas, .cd { display:none; width:100%; max-width:340px; }
    .cas.on, .cd.on { display:block; }
    .cas svg, .cd svg { width:100%; height:auto; display:block; filter:drop-shadow(0 6px 14px rgba(0,0,0,0.75)); }

    @keyframes spin { from { transform:rotate(0deg); } to { transform:rotate(360deg); } }
    .spinning { animation:spin 3.2s linear infinite; }
    .spinning-fast { animation:spin 0.8s linear infinite; }

    /* VIDEO BOX */
    #vidWrap { display:none; width:100%; background:#000; border-bottom:1px solid #2a1b0a; position:relative; }
    #vidEl { width:100%; max-height:210px; display:block; background:#000; }

    /* LCD DISPLAY & SPECTRUM */
    .lcd { flex-shrink:0; margin:5px 8px 3px; padding:6px 10px; background:linear-gradient(180deg,#08120c,#0c1c12); border:1px solid #1e422a; border-radius:6px; box-shadow:inset 0 2px 6px rgba(0,0,0,0.8); }
    .lcd-top { display:flex; justify-content:space-between; align-items:center; font-family:'Share Tech Mono',monospace; font-size:10px; color:#48b870; margin-bottom:2px; }
    .marquee { overflow:hidden; white-space:nowrap; font-size:13px; color:#88f0a8; text-shadow:0 0 6px rgba(80,220,120,0.4); }
    .marquee span { display:inline-block; padding-left:100%; animation:marq 14s linear infinite; }
    @keyframes marq { 0% { transform:translate(0,0); } 100% { transform:translate(-100%,0); } }
    #viz { width:100%; height:22px; display:block; margin-top:3px; }

    /* PROGRESS BAR */
    .prog-wrap { flex-shrink:0; padding:3px 10px; display:flex; align-items:center; gap:7px; font-family:'Share Tech Mono',monospace; font-size:10px; color:#9a7e54; }
    .prog-bar { flex:1; height:6px; background:#22150a; border:1px solid #4a3014; border-radius:3px; cursor:pointer; position:relative; overflow:hidden; }
    .prog-fill { height:100%; width:0%; background:linear-gradient(90deg,#c47a10,#f5c842); border-radius:2px; transition:width 0.1s linear; }

    /* CONTROLS */
    .ctrls { flex-shrink:0; display:flex; align-items:center; justify-content:center; gap:8px; padding:5px 8px; background:linear-gradient(180deg,#1c1208,#130c05); border-top:1px solid #2e1e0c; border-bottom:1px solid #2e1e0c; }
    .cbtn { width:34px; height:34px; border-radius:50%; background:radial-gradient(circle at 35% 30%,#4a2e16,#1e1107); border:1px solid #6e4820; color:#e8b858; font-size:13px; cursor:pointer; display:flex; align-items:center; justify-content:center; box-shadow:0 2px 5px rgba(0,0,0,0.6); }
    .cbtn:active { transform:scale(0.92); }
    .cbtn.play { width:44px; height:44px; font-size:17px; background:radial-gradient(circle at 35% 30%,#d48818,#6e3e08); border-color:#f5c842; color:#fff; box-shadow:0 0 12px rgba(232,168,48,0.4); }
    .cbtn.rec.on { background:radial-gradient(circle at 35% 30%,#c82828,#580c0c); border-color:#ff6060; color:#fff; animation:pulse 1s infinite; }
    @keyframes pulse { 0%,100% { box-shadow:0 0 4px #f04040; } 50% { box-shadow:0 0 14px #ff6060; } }

    /* VOLUME & EXTRA BAR */
    .vol-bar { flex-shrink:0; display:flex; align-items:center; justify-content:space-between; gap:6px; padding:4px 10px; background:#140d06; border-bottom:1px solid #261808; font-size:11px; }
    .vol-grp { display:flex; align-items:center; gap:5px; flex:1; }
    input[type=range] { -webkit-appearance:none; width:100%; height:4px; background:#3a2410; border-radius:2px; outline:none; }
    input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; width:12px; height:12px; border-radius:50%; background:var(--gold); cursor:pointer; }
    .xbtn { padding:2px 7px; font-size:10px; background:#1e1308; border:1px solid #4a3014; border-radius:4px; color:#c8a468; cursor:pointer; }
    .xbtn.on { border-color:var(--gold); color:var(--gold); background:#33200c; }

    /* DRAWER / PANELS */
    .drawer { display:none; padding:6px 10px; background:#181008; border-bottom:1px solid #3a2410; font-size:11px; }
    .drawer.on { display:block; }
    .eq-grid { display:flex; justify-content:space-around; gap:6px; text-align:center; }
    .eq-col { display:flex; flex-direction:column; align-items:center; gap:3px; flex:1; }
    .eq-col span { font-family:'Share Tech Mono',monospace; font-size:9px; color:#9a7e54; }
    #lyricsBox { max-height:95px; overflow-y:auto; white-space:pre-line; line-height:1.5; color:#e6cfa0; text-align:center; padding:4px; }

    /* PLAYLIST */
    .plist { flex:1; overflow-y:auto; padding:4px 8px; background:#100a05; }
    .plist::-webkit-scrollbar { width:4px; }
    .plist::-webkit-scrollbar-thumb { background:#4a3014; border-radius:2px; }
    .pitem { display:flex; align-items:center; justify-content:space-between; padding:6px 8px; margin-bottom:3px; background:#181008; border:1px solid #2a1b0c; border-radius:5px; cursor:pointer; transition:all .12s; }
    .pitem:hover { border-color:#5a3a18; }
    .pitem.on { background:linear-gradient(90deg,#33200c,#1c1208); border-color:var(--gold); color:#f5c842; }
    .pitem-title { font-size:12px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:78%; }
    .pitem-meta { font-family:'Share Tech Mono',monospace; font-size:10px; color:#8a6e44; }
    .empty-msg { text-align:center; color:#6a5234; font-size:12px; padding:24px 10px; }
  </style>
</head>
<body>
<div id="app">
  <!-- HEADER -->
  <div class="hdr">
    <div class="hdr-title">॥ श्री गणेश संगीत यन्त्र ॥</div>
    <div class="hdr-right">
      <span id="statusBadge" class="sbadge">READY</span>
      <button class="ibtn" id="btnSleep" title="स्लीप टाइमर" onclick="cycleSleep()">⏱</button>
      <button class="ibtn" id="btnEq" title="इक्वलाइजर" onclick="toggleDrawer('eqDrawer',this)">🎚</button>
      <button class="ibtn" id="btnLyr" title="शब्द / लिरिक्स" onclick="toggleDrawer('lyrDrawer',this)">📜</button>
    </div>
  </div>

  <!-- MODE TABS -->
  <div class="tabs">
    <button class="tab on" id="tabRadio" onclick="switchMode('radio')">📻 रेडियो नेपाल</button>
    <button class="tab" id="tabAudio" onclick="switchMode('audio')">🎵 अडियो फाइल</button>
    <button class="tab" id="tabVideo" onclick="switchMode('video')">🎬 भिडियो फाइल</button>
  </div>

  <!-- SELECTOR BAR -->
  <div id="selbar">
    <!-- Radio Filter -->
    <select id="rSel" class="msel" onchange="filterRadio()">
      <option value="all">सबै प्रदेश / स्टेशन</option>
      <option value="national">राष्ट्रिय प्रसारण</option>
      <option value="koshi">कोशी प्रदेश</option>
      <option value="madhesh">मधेश प्रदेश</option>
      <option value="bagmati">बागमती प्रदेश</option>
      <option value="gandaki">गण्डकी प्रदेश</option>
      <option value="lumbini">लुम्बिनी प्रदेश</option>
      <option value="karnali">कर्णाली प्रदेश</option>
      <option value="sudur">सुदूरपश्चिम प्रदेश</option>
    </select>
    <input type="text" id="searchBox" class="msel" placeholder="🔍 खोज्नुहोस्..." oninput="renderList()" />
    <!-- Device Folder / File Loader -->
    <select id="fSel" class="msel" style="display:none;" onchange="filterFolder()"></select>
    <button class="sbtn" id="btnLoadFiles" style="display:none;" onclick="document.getElementById('fileInput').click()">📂 छान्नुहोस्</button>
    <input type="file" id="fileInput" multiple accept="audio/*,video/*" style="display:none" onchange="handleFiles(this.files)" />
  </div>

  <!-- VIDEO STAGE -->
  <div id="vidWrap">
    <video id="vidEl" playsinline></video>
  </div>

  <!-- CASSETTE / CD STAGE -->
  <div id="stage">
    <div class="skin-row">
      <button class="skbtn on" onclick="setSkin('cas1',this)">CAS-I</button>
      <button class="skbtn" onclick="setSkin('cas2',this)">CAS-II</button>
      <button class="skbtn" onclick="setSkin('cd1',this)">CD-GOLD</button>
      <button class="skbtn" onclick="setSkin('cd2',this)">VINYL</button>
    </div>

    <!-- CASSETTE SKIN 1 (Classic Gold/Brown) -->
    <div class="cas on" id="cas1">
      <svg viewBox="0 0 340 165" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="body1" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0%" stop-color="#3a2410"/>
            <stop offset="100%" stop-color="#1a0f06"/>
          </linearGradient>
          <linearGradient id="lbl1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#e8c882"/>
            <stop offset="50%" stop-color="#f7e2b0"/>
            <stop offset="100%" stop-color="#d4ae60"/>
          </linearGradient>
        </defs>
        <rect x="4" y="4" width="332" height="157" rx="12" fill="url(#body1)" stroke="#7a5020" stroke-width="2"/>
        <rect x="22" y="18" width="296" height="98" rx="6" fill="url(#lbl1)"/>
        <rect x="22" y="18" width="296" height="18" rx="4" fill="#8b2500"/>
        <text x="170" y="31" text-anchor="middle" fill="#ffd97d" font-size="10" font-weight="bold">श्री गणेश • HI-FI STEREO CASSETTE C-90</text>
        <rect x="68" y="48" width="204" height="48" rx="24" fill="#181008" stroke="#5a3a18" stroke-width="2"/>
        <!-- Left Spool -->
        <g id="spoolL1" style="transform-origin:108px 72px;">
          <circle cx="108" cy="72" r="20" fill="#2c1c0e" stroke="#c89030" stroke-width="2"/>
          <circle cx="108" cy="72" r="9" fill="#120b05" stroke="#e8a830" stroke-width="1.5"/>
          <line x1="108" y1="54" x2="108" y2="90" stroke="#e8a830" stroke-width="2"/>
          <line x1="90" y1="72" x2="126" y2="72" stroke="#e8a830" stroke-width="2"/>
        </g>
        <!-- Right Spool -->
        <g id="spoolR1" style="transform-origin:232px 72px;">
          <circle cx="232" cy="72" r="20" fill="#2c1c0e" stroke="#c89030" stroke-width="2"/>
          <circle cx="232" cy="72" r="9" fill="#120b05" stroke="#e8a830" stroke-width="1.5"/>
          <line x1="232" y1="54" x2="232" y2="90" stroke="#e8a830" stroke-width="2"/>
          <line x1="214" y1="72" x2="250" y2="72" stroke="#e8a830" stroke-width="2"/>
        </g>
        <rect x="142" y="60" width="56" height="24" rx="3" fill="#0d0804" stroke="#4a3014"/>
        <text id="casTitle1" x="170" y="108" text-anchor="middle" fill="#3a1e08" font-size="10" font-weight="bold">नेपाली लोक तथा सुगम संगीत</text>
        <polygon points="55,157 70,126 270,126 285,157" fill="#241508" stroke="#5a3a18" stroke-width="1.5"/>
        <circle cx="95" cy="143" r="5" fill="#0c0703" stroke="#8a6028"/>
        <circle cx="245" cy="143" r="5" fill="#0c0703" stroke="#8a6028"/>
      </svg>
    </div>

    <!-- CASSETTE SKIN 2 (Transparent Smoke) -->
    <div class="cas" id="cas2">
      <svg viewBox="0 0 340 165" xmlns="http://www.w3.org/2000/svg">
        <rect x="4" y="4" width="332" height="157" rx="12" fill="#1a2228" stroke="#5a788a" stroke-width="2"/>
        <rect x="24" y="20" width="292" height="94" rx="6" fill="#0e1418" stroke="#3a5260"/>
        <text x="170" y="34" text-anchor="middle" fill="#70d0ff" font-size="10" font-family="Share Tech Mono">CHROME TYPE-II • DIGITAL MASTER</text>
        <g id="spoolL2" style="transform-origin:108px 72px;">
          <circle cx="108" cy="72" r="22" fill="#18242c" stroke="#60c0f0" stroke-width="2"/>
          <circle cx="108" cy="72" r="9" fill="#0a0e12" stroke="#fff" stroke-width="1.5"/>
          <line x1="94" y1="58" x2="122" y2="86" stroke="#60c0f0" stroke-width="2"/>
          <line x1="122" y1="58" x2="94" y2="86" stroke="#60c0f0" stroke-width="2"/>
        </g>
        <g id="spoolR2" style="transform-origin:232px 72px;">
          <circle cx="232" cy="72" r="22" fill="#18242c" stroke="#60c0f0" stroke-width="2"/>
          <circle cx="232" cy="72" r="9" fill="#0a0e12" stroke="#fff" stroke-width="1.5"/>
          <line x1="218" y1="58" x2="246" y2="86" stroke="#60c0f0" stroke-width="2"/>
          <line x1="246" y1="58" x2="218" y2="86" stroke="#60c0f0" stroke-width="2"/>
        </g>
        <polygon points="55,157 70,126 270,126 285,157" fill="#12181c" stroke="#4a6474" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- CD SKIN 1 (Golden Disc) -->
    <div class="cd" id="cd1">
      <svg viewBox="0 0 340 165" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <radialGradient id="cdGrad1" cx="50%" cy="50%" r="50%">
            <stop offset="15%" stop-color="#3a2410"/>
            <stop offset="45%" stop-color="#f5c842"/>
            <stop offset="70%" stop-color="#b87414"/>
            <stop offset="100%" stop-color="#fbe082"/>
          </radialGradient>
        </defs>
        <g id="disc1" style="transform-origin:170px 82px;">
          <circle cx="170" cy="82" r="74" fill="url(#cdGrad1)" stroke="#fff2b2" stroke-width="2"/>
          <circle cx="170" cy="82" r="52" fill="none" stroke="rgba(255,255,255,0.35)" stroke-width="1" stroke-dasharray="6 4"/>
          <circle cx="170" cy="82" r="24" fill="#2a1808" stroke="#e8a830" stroke-width="2"/>
          <circle cx="170" cy="82" r="10" fill="#120b05" stroke="#fff" stroke-width="1.5"/>
          <text x="170" y="46" text-anchor="middle" fill="#2a1404" font-size="9" font-weight="bold">श्री गणेश • COMPACT DISC</text>
        </g>
      </svg>
    </div>

    <!-- CD SKIN 2 (Classic Black Vinyl) -->
    <div class="cd" id="cd2">
      <svg viewBox="0 0 340 165" xmlns="http://www.w3.org/2000/svg">
        <g id="disc2" style="transform-origin:170px 82px;">
          <circle cx="170" cy="82" r="74" fill="#111" stroke="#444" stroke-width="2"/>
          <circle cx="170" cy="82" r="60" fill="none" stroke="#282828" stroke-width="1.5"/>
          <circle cx="170" cy="82" r="46" fill="none" stroke="#282828" stroke-width="1.5"/>
          <circle cx="170" cy="82" r="26" fill="#9e2a10" stroke="#e8a830" stroke-width="2"/>
          <circle cx="170" cy="82" r="8" fill="#120b05" stroke="#e8a830" stroke-width="1.5"/>
          <text x="170" y="70" text-anchor="middle" fill="#ffd97d" font-size="7" font-weight="bold">33⅓ RPM</text>
        </g>
      </svg>
    </div>
  </div>

  <!-- LCD & VISUALIZER -->
  <div class="lcd">
    <div class="lcd-top">
      <span id="modeLabel">FM / STREAM</span>
      <span id="sleepLabel"></span>
      <span id="rateLabel">STEREO • 128 KBPS</span>
    </div>
    <div class="marquee"><span id="trackTitle">स्वागत छ — कृपया तलको सूचीबाट रेडियो स्टेशन वा गीत छान्नुहोस्</span></div>
    <canvas id="viz" width="300" height="22"></canvas>
  </div>

  <!-- PROGRESS BAR -->
  <div class="prog-wrap">
    <span id="curTime">00:00</span>
    <div class="prog-bar" id="progBar" onclick="seek(event)">
      <div class="prog-fill" id="progFill"></div>
    </div>
    <span id="durTime">LIVE</span>
  </div>

  <!-- MAIN TRANSPORT CONTROLS -->
  <div class="ctrls">
    <button class="cbtn" title="अघिल्लो" onclick="prevTrack()">⏮</button>
    <button class="cbtn" title="१० सेकेन्ड पछाडि" onclick="skip(-10)">⏪</button>
    <button class="cbtn play" id="btnPlay" title="बजाउनुहोस् / रोक्नुहोस्" onclick="togglePlay()">▶</button>
    <button class="cbtn" title="रोक्नुहोस् (Stop)" onclick="stopAll()">⏹</button>
    <button class="cbtn" title="१० सेकेन्ड अगाडि" onclick="skip(10)">⏩</button>
    <button class="cbtn" title="अर्को" onclick="nextTrack()">⏭</button>
    <button class="cbtn rec" id="btnRec" title="रेकर्ड गर्नुहोस्" onclick="toggleRecord()">⏺</button>
  </div>

  <!-- VOLUME & SPEED / LOOP BAR -->
  <div class="vol-bar">
    <div class="vol-grp">
      <span>🔊</span>
      <input type="range" id="volSlider" min="0" max="1" step="0.02" value="0.9" oninput="setVol(this.value)" />
    </div>
    <button class="xbtn" id="btnLoop" onclick="toggleLoop()">🔁 दोहोर्याउने</button>
    <button class="xbtn" id="btnSpeed" onclick="cycleSpeed()">1.0x</button>
  </div>

  <!-- EQUALIZER DRAWER -->
  <div class="drawer" id="eqDrawer">
    <div class="eq-grid">
      <div class="eq-col">
        <span>BASS (60Hz)</span>
        <input type="range" min="-12" max="12" value="3" oninput="setEq(0,this.value)" />
      </div>
      <div class="eq-col">
        <span>MID (1kHz)</span>
        <input type="range" min="-12" max="12" value="0" oninput="setEq(1,this.value)" />
      </div>
      <div class="eq-col">
        <span>TREBLE (8kHz)</span>
        <input type="range" min="-12" max="12" value="4" oninput="setEq(2,this.value)" />
      </div>
    </div>
  </div>

  <!-- LYRICS / NOTES DRAWER -->
  <div class="drawer" id="lyrDrawer">
    <div id="lyricsBox">यस गीत/स्टेशनको शब्द (Lyrics) उपलब्ध छैन। रेडियो वा स्थानीय फाइल बजाउँदा यहाँ विवरण देखिनेछ।</div>
  </div>

  <!-- PLAYLIST -->
  <div class="plist" id="playlist"></div>
</div>

<audio id="audEl" crossorigin="anonymous" playsinline></audio>

<script>
  // --- RADIO STATIONS DATA ---
  const RADIOS = [
    { name: "रेडियो नेपाल (राष्ट्रिय प्रसारण)", region: "national", url: "https://stream1.radionepal.gov.np/live/" },
    { name: "रेडियो जनसञ्चार (भक्तपुर)", region: "bagmati", url: "https://stream.zeno.fm/0r0xa792kwzuv" },
    { name: "उज्यालो ९० नेटवर्क (काठमाडौँ)", region: "bagmati", url: "https://stream.zeno.fm/h527zwd11uquv" },
    { name: "कान्तिपुर एफएम ९६.१", region: "bagmati", url: "https://broadcast.radiokantipur.com/radio/8000/radio.mp3" },
    { name: "इमेज एफएम ९७.९", region: "bagmati", url: "https://streaming.softnep.net:10914/;" },
    { name: "रेडियो अन्नपूर्ण नेपाल (पोखरा)", region: "gandaki", url: "https://streaming.softnep.net:10900/;" },
    { name: "रेडियो बाराही ९९.२ (पोखरा)", region: "gandaki", url: "https://streaming.softnep.net:10848/;" },
    { name: "सप्तकोशी एफएम (इटहरी)", region: "koshi", url: "https://streaming.softnep.net:10964/;" },
    { name: "रेडियो तराई १०७ (वीरगञ्ज)", region: "madhesh", url: "https://streaming.softnep.net:10924/;" },
    { name: "रेडियो लुम्बिनी ९६.८ (बुटवल)", region: "lumbini", url: "https://streaming.softnep.net:10982/;" },
    { name: "रेडियो भेरी ९८.६ (सुर्खेत)", region: "karnali", url: "https://streaming.softnep.net:10970/;" },
    { name: "दिनेश एफएम ९३.८ (धनगढी)", region: "sudur", url: "https://streaming.softnep.net:10944/;" }
  ];

  // --- STATE ---
  let mode = 'radio'; // 'radio' | 'audio' | 'video'
  let audioTracks = [];
  let videoTracks = [];
  let currentList = [];
  let currentIndex = -1;
  let isPlaying = false;
  let isLoop = false;
  let speeds = [1.0, 1.25, 1.5, 0.75];
  let speedIdx = 0;
  let sleepMinutes = 0;
  let sleepTimer = null;

  // Web Audio API (Visualizer & EQ)
  let audioCtx, analyser, sourceNode, eqFilters = [];
  let mediaRecorder, recordedChunks = [];

  const audEl = document.getElementById('audEl');
  const vidEl = document.getElementById('vidEl');
  const badge = document.getElementById('statusBadge');

  function activeMedia() {
    return mode === 'video' ? vidEl : audEl;
  }

  // --- INIT ---
  window.addEventListener('DOMContentLoaded', () => {
    filterRadio();
    drawIdleVisualizer();
  });

  function setStatus(txt, cls = '') {
    badge.textContent = txt;
    badge.className = 'sbadge ' + cls;
  }

  // --- MODE SWITCHING ---
  function switchMode(newMode) {
    stopAll();
    mode = newMode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('on'));
    document.getElementById('tab' + newMode.charAt(0).toUpperCase() + newMode.slice(1)).classList.add('on');

    const rSel = document.getElementById('rSel');
    const fSel = document.getElementById('fSel');
    const btnLoad = document.getElementById('btnLoadFiles');
    const stage = document.getElementById('stage');
    const vidWrap = document.getElementById('vidWrap');

    if (mode === 'radio') {
      rSel.style.display = 'block';
      fSel.style.display = 'none';
      btnLoad.style.display = 'none';
      stage.style.display = 'flex';
      vidWrap.style.display = 'none';
      document.getElementById('modeLabel').textContent = 'FM / STREAM';
      document.getElementById('durTime').textContent = 'LIVE';
      filterRadio();
    } else {
      rSel.style.display = 'none';
      fSel.style.display = 'block';
      btnLoad.style.display = 'inline-block';
      stage.style.display = mode === 'audio' ? 'flex' : 'none';
      vidWrap.style.display = mode === 'video' ? 'block' : 'none';
      document.getElementById('modeLabel').textContent = mode === 'audio' ? 'LOCAL AUDIO' : 'LOCAL VIDEO';
      updateFolderSelect();
      renderList();
    }
  }

  // --- FILE HANDLING ---
  function handleFiles(fileList) {
    const files = Array.from(fileList);
    if (!files.length) return;

    files.forEach(file => {
      const url = URL.createObjectURL(file);
      const folder = file.webkitRelativePath ? file.webkitRelativePath.split('/')[0] : 'मेरो डिभाइस';
      const item = { name: file.name.replace(/\.[^/.]+$/, ""), folder, url, type: file.type };
      if (file.type.startsWith('video/') || mode === 'video') {
        videoTracks.push(item);
      } else {
        audioTracks.push(item);
      }
    });

    updateFolderSelect();
    renderList();
    setStatus('LOADED (' + files.length + ')');
  }

  function updateFolderSelect() {
    const list = mode === 'audio' ? audioTracks : videoTracks;
    const folders = ['all', ...new Set(list.map(t => t.folder))];
    const fSel = document.getElementById('fSel');
    fSel.innerHTML = folders.map(f => `<option value="${f}">${f === 'all' ? 'सबै फोल्डर (' + list.length + ')' : f}</option>`).join('');
  }

  function filterRadio() {
    const reg = document.getElementById('rSel').value;
    currentList = reg === 'all' ? [...RADIOS] : RADIOS.filter(r => r.region === reg);
    renderList();
  }

  function filterFolder() {
    renderList();
  }

  function renderList() {
    const q = document.getElementById('searchBox').value.toLowerCase().trim();
    let base = mode === 'radio' ? RADIOS.filter(r => document.getElementById('rSel').value === 'all' || r.region === document.getElementById('rSel').value)
      : (mode === 'audio' ? audioTracks : videoTracks);

    if (mode !== 'radio') {
      const fVal = document.getElementById('fSel').value;
      if (fVal && fVal !== 'all') base = base.filter(t => t.folder === fVal);
    }

    currentList = q ? base.filter(item => item.name.toLowerCase().includes(q)) : base;
    const container = document.getElementById('playlist');

    if (!currentList.length) {
      container.innerHTML = `<div class="empty-msg">${mode === 'radio' ? 'कुनै स्टेशन भेटिएन।' : 'माथिको "📂 छान्नुहोस्" बटन थिचेर अडियो/भिडियो फाइल लोड गर्नुहोस्।'}</div>`;
      return;
    }

    container.innerHTML = currentList.map((item, idx) => `
      <div class="pitem ${idx === currentIndex ? 'on' : ''}" onclick="playIndex(${idx})">
        <div class="pitem-title">${idx + 1}. ${item.name}</div>
        <div class="pitem-meta">${mode === 'radio' ? 'LIVE' : 'MEDIA'}</div>
      </div>
    `).join('');
  }

  // --- PLAYBACK ---
  function initAudioEngine() {
    if (audioCtx) return;
    try {
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      audioCtx = new AudioContext();
      analyser = audioCtx.createAnalyser();
      analyser.fftSize = 64;

      const freqs = [60, 1000, 8000];
      eqFilters = freqs.map((f, i) => {
        const filter = audioCtx.createBiquadFilter();
        filter.type = i === 0 ? 'lowshelf' : (i === 2 ? 'highshelf' : 'peaking');
        filter.frequency.value = f;
        return filter;
      });

      sourceNode = audioCtx.createMediaElementSource(audEl);
      sourceNode.connect(eqFilters[0]);
      eqFilters[0].connect(eqFilters[1]);
      eqFilters[1].connect(eqFilters[2]);
      eqFilters[2].connect(analyser);
      analyser.connect(audioCtx.destination);
    } catch (e) {
      console.warn("WebAudio fallback:", e);
    }
  }

  function playIndex(idx) {
    if (idx < 0 || idx >= currentList.length) return;
    currentIndex = idx;
    const track = currentList[idx];
    const media = activeMedia();

    if (mode !== 'video') initAudioEngine();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();

    setStatus('BUFFERING', 'busy');
    document.getElementById('trackTitle').textContent = track.name;
    document.getElementById('casTitle1').textContent = track.name.slice(0, 28);

    media.src = track.url;
    media.loop = isLoop;
    media.playbackRate = speeds[speedIdx];
    media.play().then(() => {
      isPlaying = true;
      updatePlayUI(true);
      setStatus(mode === 'radio' ? 'ON AIR' : 'PLAYING');
      renderList();
      startVisualizer();
    }).catch(err => {
      setStatus('ERROR', 'err');
      console.error(err);
    });
  }

  function togglePlay() {
    const media = activeMedia();
    if (!media.src && currentList.length) {
      playIndex(0);
      return;
    }
    if (media.paused) {
      if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      media.play();
      isPlaying = true;
      updatePlayUI(true);
      setStatus(mode === 'radio' ? 'ON AIR' : 'PLAYING');
    } else {
      media.pause();
      isPlaying = false;
      updatePlayUI(false);
      setStatus('PAUSED', 'busy');
    }
  }

  function stopAll() {
    [audEl, vidEl].forEach(m => {
      m.pause();
      m.currentTime = 0;
    });
    isPlaying = false;
    updatePlayUI(false);
    setStatus('STOPPED');
  }

  function prevTrack() {
    if (!currentList.length) return;
    const prev = (currentIndex - 1 + currentList.length) % currentList.length;
    playIndex(prev);
  }

  function nextTrack() {
    if (!currentList.length) return;
    const next = (currentIndex + 1) % currentList.length;
    playIndex(next);
  }

  function skip(sec) {
    const media = activeMedia();
    if (media.duration && isFinite(media.duration)) {
      media.currentTime = Math.max(0, Math.min(media.duration, media.currentTime + sec));
    }
  }

  function updatePlayUI(playing) {
    document.getElementById('btnPlay').textContent = playing ? '⏸' : '▶';
    const animTargets = ['spoolL1', 'spoolR1', 'spoolL2', 'spoolR2', 'disc1', 'disc2'];
    animTargets.forEach(id => {
      const el = document.getElementById(id);
      if (el) {
        if (playing) el.classList.add('spinning');
        else el.classList.remove('spinning');
      }
    });
  }

  // --- TIME & SEEK ---
  [audEl, vidEl].forEach(media => {
    media.addEventListener('timeupdate', () => {
      if (media !== activeMedia()) return;
      const cur = media.currentTime || 0;
      const dur = media.duration;
      document.getElementById('curTime').textContent = fmtTime(cur);
      if (dur && isFinite(dur)) {
        document.getElementById('durTime').textContent = fmtTime(dur);
        document.getElementById('progFill').style.width = ((cur / dur) * 100) + '%';
      } else {
        document.getElementById('durTime').textContent = 'LIVE';
        document.getElementById('progFill').style.width = '100%';
      }
    });

    media.addEventListener('ended', () => {
      if (!isLoop && mode !== 'radio') nextTrack();
    });
  });

  function seek(e) {
    const media = activeMedia();
    if (!media.duration || !isFinite(media.duration)) return;
    const rect = document.getElementById('progBar').getBoundingClientRect();
    const pct = Math.max(0, Math.min(1, (e.clientX - rect.left) / rect.width));
    media.currentTime = pct * media.duration;
  }

  function fmtTime(s) {
    const m = Math.floor(s / 60);
    const sec = Math.floor(s % 60);
    return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
  }

  // --- VOLUME, SPEED, LOOP, EQ, SLEEP ---
  function setVol(v) {
    audEl.volume = v;
    vidEl.volume = v;
  }

  function toggleLoop() {
    isLoop = !isLoop;
    activeMedia().loop = isLoop;
    document.getElementById('btnLoop').classList.toggle('on', isLoop);
  }

  function cycleSpeed() {
    speedIdx = (speedIdx + 1) % speeds.length;
    const sp = speeds[speedIdx];
    activeMedia().playbackRate = sp;
    document.getElementById('btnSpeed').textContent = sp + 'x';
  }

  function setEq(bandIdx, val) {
    if (eqFilters[bandIdx]) eqFilters[bandIdx].gain.value = parseFloat(val);
  }

  function toggleDrawer(id, btn) {
    const el = document.getElementById(id);
    const open = el.classList.toggle('on');
    btn.classList.toggle('on', open);
  }

  function setSkin(skinId, btn) {
    document.querySelectorAll('.cas, .cd').forEach(el => el.classList.remove('on'));
    document.getElementById(skinId).classList.add('on');
    document.querySelectorAll('.skbtn').forEach(b => b.classList.remove('on'));
    btn.classList.add('on');
  }

  function cycleSleep() {
    const opts = [0, 15, 30, 60];
    sleepMinutes = opts[(opts.indexOf(sleepMinutes) + 1) % opts.length];
    clearTimeout(sleepTimer);
    const lbl = document.getElementById('sleepLabel');
    const btn = document.getElementById('btnSleep');
    if (sleepMinutes > 0) {
      lbl.textContent = `⏱ ${sleepMinutes}m`;
      btn.classList.add('on');
      sleepTimer = setTimeout(() => {
        stopAll();
        lbl.textContent = '';
        btn.classList.remove('on');
        sleepMinutes = 0;
      }, sleepMinutes * 60000);
    } else {
      lbl.textContent = '';
      btn.classList.remove('on');
    }
  }

  // --- STREAM / AUDIO RECORDING ---
  function toggleRecord() {
    const btn = document.getElementById('btnRec');
    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      btn.classList.remove('on');
      setStatus('SAVED');
      return;
    }

    try {
      const stream = audEl.captureStream ? audEl.captureStream() : audEl.mozCaptureStream();
      recordedChunks = [];
      mediaRecorder = new MediaRecorder(stream);
      mediaRecorder.ondataavailable = e => { if (e.data.size > 0) recordedChunks.push(e.data); };
      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'audio/webm' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `Ganesh_Player_Rec_${Date.now()}.webm`;
        a.click();
      };
      mediaRecorder.start();
      btn.classList.add('on');
      setStatus('REC ●', 'err');
    } catch (e) {
      alert('रेकर्डिङ सुरु गर्नुअघि कृपया कुनै अडियो वा रेडियो बजाउनुहोस्।');
    }
  }

  // --- SPECTRUM VISUALIZER ---
  function drawIdleVisualizer() {
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = '#1e422a';
    for (let i = 0; i < 32; i++) {
      ctx.fillRect(i * 9.5, 18, 6, 3);
    }
  }

  function startVisualizer() {
    const canvas = document.getElementById('viz');
    const ctx = canvas.getContext('2d');
    const bufLen = analyser ? analyser.frequencyBinCount : 32;
    const dataArr = new Uint8Array(bufLen);

    function renderFrame() {
      if (!isPlaying) {
        drawIdleVisualizer();
        return;
      }
      requestAnimationFrame(renderFrame);
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (analyser) analyser.getByteFrequencyData(dataArr);
      for (let i = 0; i < 32; i++) {
        const val = analyser ? dataArr[i] : (Math.random() * 140 + 40);
        const h = Math.max(3, (val / 255) * canvas.height);
        ctx.fillStyle = val > 180 ? '#f5c842' : '#50d880';
        ctx.fillRect(i * 9.5, canvas.height - h, 6, h);
      }
    }
    renderFrame();
  }
</script>
</body>
</html>
